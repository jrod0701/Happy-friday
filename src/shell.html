<title>Happy Friday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Archivo:wght@500;700;800&display=swap">
<style>
/* One narrow arcade-cabinet column. Single dark CRT-night theme in the PICO palette the games use. */
:root{
  --bg:#0e0c1a; --panel:#1d2b53; --panel2:#17203f; --line:#000; --fg:#fff1e8; --muted:#a9b0c8;
  --accent:#ffa300; --accent-ink:#1a0d00; --good:#00e436; --bad:#ff004d; --sky:#29adff; --sun:#ffec27;
  --pix:"Press Start 2P","Courier New",ui-monospace,monospace;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  color:var(--fg);font:500 16px/1.45 var(--body);padding-inline:16px;padding-block:18px 56px;-webkit-tap-highlight-color:transparent}
body.staged{overflow:hidden}
.wrap{max-width:440px;margin:0 auto;display:grid;gap:20px}
section{display:grid;gap:18px;min-width:0}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:4px solid var(--fg)}
.top canvas{width:48px;height:48px;image-rendering:pixelated;flex:none}
.top .ttl{flex:1;min-width:0;display:grid;gap:6px}
.mark{font:400 22px/1.15 var(--pix);color:var(--sun);text-shadow:3px 3px 0 #ff004d;letter-spacing:.01em}
.sub{font:400 9px/1.5 var(--pix);color:var(--muted)}
.me{appearance:none;border:3px solid #000;background:var(--panel2);color:var(--fg);font:400 9px/1 var(--pix);padding:10px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:44px}
.me canvas{width:24px;height:24px}
h2{font:400 15px/1.5 var(--pix);margin:0;text-wrap:balance}
h3{font:400 10px/1.5 var(--pix);color:var(--muted);margin:0;text-transform:uppercase}
p{margin:0}
.lede{color:var(--muted)}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #2b3f7e;padding:16px;display:grid;gap:12px;min-width:0}
.btn{appearance:none;border:3px solid var(--line);background:var(--accent);color:var(--accent-ink);font:400 12px/1.3 var(--pix);padding:16px 18px;cursor:pointer;box-shadow:4px 4px 0 #000;min-height:52px;
  -webkit-user-select:none;user-select:none;text-wrap:balance}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn.go{background:var(--good)}
.btn.big{font-size:15px;padding:22px 18px;min-height:72px;width:100%}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.link{appearance:none;background:none;border:0;color:var(--muted);font:600 14px/1.3 var(--body);text-decoration:underline;text-underline-offset:3px;padding:10px 4px;cursor:pointer;justify-self:start;min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
textarea{width:100%;font:16px/1.4 var(--body);background:#0e0c1a;color:var(--fg);border:3px solid #000;padding:10px;resize:vertical;min-height:84px}
.note{font-size:14px;color:var(--muted)}

/* who are you */
.who{display:grid;gap:12px}
.who button{appearance:none;border:4px solid #000;background:var(--panel);color:var(--fg);display:flex;align-items:center;gap:16px;padding:14px 16px;cursor:pointer;min-height:76px;box-shadow:4px 4px 0 #000;text-align:left}
.who button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.who canvas{width:48px;height:48px;image-rendering:pixelated;flex:none}
.who b{font:400 15px/1.2 var(--pix);display:block}
.who span{font-size:13px;color:var(--muted)}

/* box art */
.carts{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.cart{display:grid;gap:6px;min-width:0;text-align:center}
.cart canvas{width:100%;height:auto;aspect-ratio:96/128;image-rendering:pixelated;display:block;box-shadow:4px 4px 0 #000;border:2px solid #000}
.cart.tap{cursor:pointer;-webkit-user-select:none;user-select:none}
.cart.tap:active canvas{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.cart .n{font:400 8px/1.4 var(--pix);color:var(--muted)}
.cart .sc{font:400 12px/1.2 var(--pix);color:var(--sun)}
.cart .rk{font:400 8px/1.2 var(--pix);padding:5px 4px;color:#10101a;background:var(--muted)}
.cart .rk.r1{background:var(--sun)} .cart .rk.r2{background:#c2c3c7} .cart .rk.r3{background:#ab5236;color:var(--fg)} .cart .rk.w{background:var(--panel2);color:var(--muted)}

/* crew list */
.crew{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:12px;background:var(--panel2);border:3px solid #000;padding:10px 12px}
.pl canvas{width:36px;height:36px;image-rendering:pixelated;flex:none}
.pl b{font:800 16px/1.2 var(--body);display:block}
.pl span{font-size:13px;color:var(--muted)}
.pl .pt{margin-left:auto;font:400 12px var(--pix);color:var(--sun);white-space:nowrap}
.pl.top1{border-color:var(--sun)}

/* result + message */
.hero{font:400 16px/1.5 var(--pix);text-wrap:balance}
.hero em{font-style:normal;color:var(--sun)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:3px solid #000;background:var(--panel2);color:var(--fg);font:600 14px/1.2 var(--body);padding:10px 12px;cursor:pointer;min-height:44px}
.chip:active{background:var(--accent);color:#1a0d00}
.bubble{background:#0b84ff;color:#fff;border-radius:20px 20px 4px 20px;padding:14px 16px;font:500 16px/1.45 var(--body);white-space:pre-wrap;word-break:break-word;max-width:100%;justify-self:end}
.bubble .dim{opacity:.7;font-size:13px}
.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:90px}
details summary{cursor:pointer;font:700 14px var(--body);color:var(--muted);padding:12px 0;min-height:44px}
#stageWrap{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:#0b0a14;display:none;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stageWrap canvas{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}
#arcadeBtn{background:#3b1d6e;color:#ffec27;border-color:#000;animation:arc 1.1s steps(2,end) infinite}
#arcadeBtn::before{content:"\1F579 "}
@keyframes arc{0%{background:#3b1d6e;color:#ffec27;box-shadow:4px 4px 0 #000,0 0 0 3px #ff004d}50%{background:#ff004d;color:#fff1e8;box-shadow:4px 4px 0 #000,0 0 14px 4px #ffa300}100%{background:#3b1d6e;color:#ffec27;box-shadow:4px 4px 0 #000,0 0 0 3px #ff004d}}
@media (prefers-reduced-motion:reduce){#arcadeBtn{animation:none}.btn:active,.who button:active{transform:none}}
</style>

<main class="wrap">
  <header class="top">
    <canvas id="sun" aria-hidden="true"></canvas>
    <div class="ttl"><span class="mark">HAPPY FRIDAY</span><span class="sub" id="tag">Same crew. New games.</span></div>
    <button class="me" id="whoBtn" type="button" hidden></button>
  </header>

  <section id="who" hidden>
    <h2>Who's holding this phone?</h2>
    <div class="who" id="whoList"></div>
  </section>

  <section id="home" hidden>
    <h2 class="hero" id="hero"></h2>
    <button class="btn go big" id="mainBtn" type="button"></button>
    <p class="note" id="mainNote" role="status"></p>
    <h3 id="tonightH">Tonight's games</h3>
    <div class="carts" id="carts" aria-label="Tonight's three games"></div>
    <div class="crew" id="crew" hidden></div>
    <details id="joinBox">
      <summary>Got a message from the crew? Paste it here</summary>
      <div style="display:grid;gap:10px">
        <textarea id="codeIn" class="code" placeholder="Paste the whole text message here. It loads by itself." aria-label="Pasted message from the crew"></textarea>
        <p class="note" id="joinNote" role="status"></p>
      </div>
    </details>
    <button class="btn ghost" id="arcadeBtn" type="button">ARCADE <span style="display:block;font-size:9px;margin-top:8px;color:inherit">INSERT COIN. PLAY ANY GAME SOLO.</span></button>
    <div class="row"><button class="link" id="newBtn" type="button" hidden></button><button class="link" id="muteBtn" type="button"></button></div>
  </section>

  <section id="send" hidden>
    <h2 class="hero" id="sendHero"></h2>
    <div class="carts" id="runCarts"></div>
    <div class="panel">
      <h3 id="noteLabel">Say something</h3>
      <div class="chips" id="quick"></div>
      <textarea id="noteIn" maxlength="140" placeholder="Talk some trash or say something nice." aria-label="Message to the crew"></textarea>
    </div>
    <div class="panel">
      <h3>Your text</h3>
      <div class="bubble" id="bubble"></div>
      <button class="btn go big" id="shareBtn" type="button">SEND IT TO THE CREW</button>
      <p class="note" id="copyNote" role="status"></p>
      <details><summary>Show the full text</summary><textarea id="shareOut" class="code" readonly aria-label="Full message"></textarea></details>
    </div>
    <button class="link" id="doneBtn" type="button">Back to the games</button>
  </section>
</main>
